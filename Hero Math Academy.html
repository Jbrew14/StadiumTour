<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hero Math Academy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@600;800&display=swap">
<style>
:root{
  --bg:#fff3cf; --dots:#ffd966; --panel:#ffffff; --ink:#14213d; --line:#14213d;
  --red:#e63946; --blue:#2a6fdb; --gold:#ffb703; --green:#2a9d4a; --soft:#e8eefc;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0f1730; --dots:#18244a; --panel:#1b2850; --ink:#fff3cf; --line:#ffb703; --soft:#26356b; color-scheme:dark;}
}
:root[data-theme="dark"]{--bg:#0f1730; --dots:#18244a; --panel:#1b2850; --ink:#fff3cf; --line:#ffb703; --soft:#26356b; color-scheme:dark;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-weight:600;
  background-color:var(--bg);background-image:radial-gradient(var(--dots) 18%,transparent 20%);background-size:18px 18px}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1,h2,.big,.btn,.burst{font-family:Bangers,Impact,'Arial Black',sans-serif;letter-spacing:.04em;font-weight:400}
.panel{background:var(--panel);border:4px solid var(--line);border-radius:14px;box-shadow:6px 6px 0 var(--line);padding:16px;margin-bottom:18px}
h1{font-size:clamp(42px,12vw,64px);line-height:.95;margin:6px 0 4px;color:var(--red);text-shadow:3px 3px 0 var(--line);transform:rotate(-2deg)}
h2{font-size:28px;margin:0 0 10px}
.sub{margin:0 0 6px;font-size:17px}
.label{font-weight:800;margin:14px 0 8px;font-size:16px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:800 16px Nunito,system-ui,sans-serif;color:var(--ink);background:var(--soft);border:3px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;min-height:44px}
.chip[aria-pressed="true"]{background:var(--gold);color:#14213d;box-shadow:3px 3px 0 var(--line)}
.chip:focus-visible,.btn:focus-visible,.ans:focus-visible{outline:4px solid var(--blue);outline-offset:2px}
.heroes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.heroes .chip{display:flex;align-items:center;gap:8px;text-align:left}
.heroes .em{font-size:28px}
.btn{font-size:30px;background:var(--red);color:#fff;border:4px solid var(--line);border-radius:12px;padding:10px 22px;box-shadow:5px 5px 0 var(--line);cursor:pointer;width:100%;margin-top:18px;min-height:56px}
.btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--line)}
.btn.alt{background:var(--blue)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-weight:800}
.pill{background:var(--panel);border:3px solid var(--line);border-radius:999px;padding:4px 12px}
.arena{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:4px}
.fighter .em{font-size:64px;line-height:1;display:inline-block}
.fighter .nm{font-size:14px;font-weight:800}
.vs{font-family:Bangers,Impact,sans-serif;font-size:30px;color:var(--red)}
.bar{height:16px;border:3px solid var(--line);border-radius:8px;background:var(--soft);overflow:hidden;margin:6px 6px 0}
.bar i{display:block;height:100%;background:var(--red);transition:width .4s}
.hit{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px) rotate(-6deg)}40%{transform:translateX(10px) rotate(6deg)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.qbox{position:relative;text-align:center}
.big{font-size:clamp(56px,18vw,88px);line-height:1;margin:6px 0 4px}
.hint{min-height:26px;font-weight:800;margin:0 0 8px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ans{font-family:Bangers,Impact,sans-serif;font-size:44px;background:var(--soft);color:var(--ink);border:4px solid var(--line);border-radius:12px;padding:14px 0;cursor:pointer;box-shadow:4px 4px 0 var(--line);min-height:68px}
.ans.good{background:var(--green);color:#fff}
.ans.bad{background:var(--red);color:#fff}
.ans:disabled{cursor:default}
.burst{position:absolute;left:50%;top:-6px;transform:translateX(-50%) rotate(-8deg);font-size:46px;color:#14213d;background:var(--gold);border:4px solid var(--line);padding:2px 18px;border-radius:30px 8px 30px 8px;pointer-events:none;opacity:0}
.burst.show{animation:pop .9s}
@keyframes pop{0%{opacity:0;transform:translateX(-50%) scale(.3) rotate(-8deg)}25%{opacity:1;transform:translateX(-50%) scale(1.15) rotate(-8deg)}80%{opacity:1}100%{opacity:0;transform:translateX(-50%) scale(1) rotate(-8deg)}}
.stars{font-size:52px;letter-spacing:6px;text-align:center}
.center{text-align:center}
.hidden{display:none}
@media (prefers-reduced-motion:reduce){.hit,.burst.show{animation:none}.burst.show{opacity:1}}
</style>
</head>
<body>
<div class="wrap">

<section id="start">
  <div class="panel center">
    <h1>Hero Math Academy</h1>
    <p class="sub">Beat the villain with your multiplication and division powers!</p>
  </div>
  <div class="panel">
    <div class="label">1. Pick your hero</div>
    <div class="heroes" id="heroes"></div>
    <div class="label">2. Pick your power</div>
    <div class="row" id="modes"></div>
    <div class="label">3. Which times table?</div>
    <div class="row" id="tables"></div>
    <button class="btn" id="go">Start mission!</button>
  </div>
  <p class="center" id="best"></p>
</section>

<section id="play" class="hidden">
  <div class="top"><span class="pill" id="prog"></span><span class="pill" id="score"></span><span class="pill" id="streak"></span></div>
  <div class="panel">
    <div class="arena">
      <div class="fighter"><div class="em" id="hEm"></div><div class="nm" id="hNm"></div></div>
      <div class="vs">VS</div>
      <div class="fighter"><div class="em" id="vEm"></div><div class="nm" id="vNm"></div><div class="bar" aria-label="Villain power"><i id="vBar"></i></div></div>
    </div>
  </div>
  <div class="panel qbox">
    <div class="burst" id="burst"></div>
    <div class="big" id="q"></div>
    <p class="hint" id="hint" aria-live="polite"></p>
    <div class="answers" id="answers"></div>
    <button class="btn alt hidden" id="next">Next!</button>
  </div>
</section>

<section id="end" class="hidden">
  <div class="panel center">
    <h2 id="endTitle"></h2>
    <div class="stars" id="endStars" aria-hidden="true"></div>
    <p class="sub" id="endMsg"></p>
    <p class="sub" id="endScore"></p>
    <button class="btn" id="again">Play again</button>
    <button class="btn alt" id="menu">Change hero or table</button>
  </div>
</section>

</div>
<script>
(function(){
  var HEROES=[{n:'Captain Comet',e:'⚡'},{n:'Nova Knight',e:'🛡️'},{n:'Turbo Tiger',e:'🐯'},{n:'Jet Jade',e:'🚀'}];
  var VILLAINS=[{n:'Professor Glitch',e:'🤖'},{n:'Baron Blot',e:'👾'},{n:'Doctor Dizzy',e:'🦹'},{n:'Count Static',e:'👻'}];
  var MODES=[{k:'mul',t:'Multiply ×'},{k:'div',t:'Divide ÷'},{k:'mix',t:'Mix it up'}];
  var WORDS=['POW!','ZAP!','BAM!','WHAM!','KAPOW!','BOOM!'];
  var TOTAL=10, NEED=7, BESTKEY='hero-math-best';
  var S={hero:0,mode:'mul',table:'all',idx:0,correct:0,score:0,streak:0,maxStreak:0,ans:0,locked:false,last:'',v:VILLAINS[0]};
  var $=function(id){return document.getElementById(id)};
  var rand=function(a,b){return a+Math.floor(Math.random()*(b-a+1))};

  function chips(box,items,sel,fn){
    box.innerHTML='';
    items.forEach(function(it){
      var b=document.createElement('button');b.className='chip';b.type='button';
      b.innerHTML=it.html;b.setAttribute('aria-pressed',String(sel(it)));
      b.onclick=function(){fn(it);render()};box.appendChild(b);
    });
  }
  function render(){
    chips($('heroes'),HEROES.map(function(h,i){return{i:i,html:'<span class="em">'+h.e+'</span>'+h.n}}),function(it){return it.i===S.hero},function(it){S.hero=it.i});
    chips($('modes'),MODES.map(function(m){return{k:m.k,html:m.t}}),function(it){return it.k===S.mode},function(it){S.mode=it.k});
    var t=[{k:'all',html:'All 0–10'}];for(var i=0;i<=10;i++)t.push({k:String(i),html:String(i)});
    chips($('tables'),t,function(it){return it.k===S.table},function(it){S.table=it.k});
  }
  function show(id){['start','play','end'].forEach(function(s){$(s).classList.toggle('hidden',s!==id)});window.scrollTo(0,0)}
  function bestGet(){try{return parseInt(localStorage.getItem(BESTKEY)||'0',10)||0}catch(e){return 0}}
  function bestSet(v){try{localStorage.setItem(BESTKEY,String(v))}catch(e){}}
  function showBest(){var b=bestGet();$('best').textContent=b?'Your best score: '+b:''}

  function makeQ(){
    var kind=S.mode==='mix'?(Math.random()<.5?'mul':'div'):S.mode,text,ans,a,b,tries=0;
    do{
      if(kind==='mul'){
        a=S.table==='all'?rand(0,10):+S.table;b=rand(0,10);
        if(Math.random()<.5){var x=a;a=b;b=x}
        ans=a*b;text=a+' × '+b;
      }else{
        a=S.table==='all'||S.table==='0'?rand(1,10):+S.table;b=rand(0,10);
        ans=b;text=(a*b)+' ÷ '+a;
      }
      tries++;
    }while(text===S.last&&tries<8);
    S.last=text;
    var pool=[ans-1,ans+1,ans-2,ans+2,ans+10,ans-10,ans+a,ans-a,ans+b,ans-b],opts=[ans];
    pool.sort(function(){return Math.random()-.5});
    pool.forEach(function(p){if(opts.length<4&&p>=0&&opts.indexOf(p)<0)opts.push(p)});
    while(opts.length<4){var r=rand(0,kind==='mul'?100:10);if(opts.indexOf(r)<0)opts.push(r)}
    opts.sort(function(){return Math.random()-.5});
    return{text:text,ans:ans,opts:opts,kind:kind,a:a,b:b};
  }
  function hud(){
    $('prog').textContent='Question '+Math.min(S.idx+1,TOTAL)+' of '+TOTAL;
    $('score').textContent='⭐ '+S.score;
    $('streak').textContent='🔥 '+S.streak;
    $('vBar').style.width=Math.max(0,(NEED-S.correct)/NEED*100)+'%';
  }
  function ask(){
    S.locked=false;var q=S.q=makeQ();
    $('q').textContent=q.text+' = ?';
    $('hint').textContent='';$('next').classList.add('hidden');
    var box=$('answers');box.innerHTML='';
    q.opts.forEach(function(o){
      var b=document.createElement('button');b.className='ans';b.type='button';b.textContent=o;
      b.onclick=function(){pick(b,o)};box.appendChild(b);
    });
    hud();
  }
  function burst(txt){var el=$('burst');el.textContent=txt;el.classList.remove('show');void el.offsetWidth;el.classList.add('show')}
  function pick(btn,val){
    if(S.locked)return;S.locked=true;
    var q=S.q,all=$('answers').children;
    for(var i=0;i<all.length;i++){all[i].disabled=true;if(+all[i].textContent===q.ans)all[i].classList.add('good')}
    if(val===q.ans){
      S.correct++;S.streak++;S.maxStreak=Math.max(S.maxStreak,S.streak);
      S.score+=10+(S.streak>=3?5:0);
      burst(WORDS[rand(0,WORDS.length-1)]);
      $('hint').textContent=S.streak>=3?'Streak power! Bonus points!':'Direct hit!';
      var v=$('vEm');v.classList.remove('hit');void v.offsetWidth;v.classList.add('hit');
      hud();setTimeout(advance,1000);
    }else{
      btn.classList&&0;
      btn.classList.add('bad');S.streak=0;
      $('hint').textContent='Almost! '+q.text+' = '+q.ans;
      hud();$('next').classList.remove('hidden');$('next').focus();
    }
  }
  function advance(){S.idx++;if(S.idx>=TOTAL)finish();else ask()}
  function finish(){
    var won=S.correct>=NEED,stars=S.correct>=9?3:S.correct>=7?2:S.correct>=5?1:0;
    $('endTitle').textContent=won?'Mission complete!':'Good try, hero!';
    $('endStars').textContent=('★'.repeat(stars))+('☆'.repeat(3-stars));
    $('endStars').style.color='var(--gold)';
    $('endMsg').textContent=won?HEROES[S.hero].n+' defeated '+S.v.n+'! You got '+S.correct+' of '+TOTAL+'.':S.v.n+' got away this time. You got '+S.correct+' of '+TOTAL+'. Train and try again!';
    var b=bestGet(),nb=S.score>b;if(nb)bestSet(S.score);
    $('endScore').textContent='Score: '+S.score+(nb?' (new best!)':'')+' · Best streak: '+S.maxStreak;
    show('end');
  }
  function start(){
    S.idx=0;S.correct=0;S.score=0;S.streak=0;S.maxStreak=0;S.last='';
    S.v=VILLAINS[rand(0,VILLAINS.length-1)];
    var h=HEROES[S.hero];
    $('hEm').textContent=h.e;$('hNm').textContent=h.n;$('vEm').textContent=S.v.e;$('vNm').textContent=S.v.n;
    show('play');ask();
  }
  $('go').onclick=start;$('again').onclick=start;$('next').onclick=advance;
  $('menu').onclick=function(){showBest();show('start')};
  render();showBest();
})();
</script>
</body>
</html>
